name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    strategy:
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Sync version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=${REF_NAME#v}
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false  # Skip code signing

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cockpit-mac-${{ matrix.arch }}
          path: out/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.dmg
          generate_release_notes: true

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}  # Skip prereleases (v1.0.0-beta)

    steps:
      - name: Extract version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download release assets and compute checksums
        id: checksums
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Download DMGs
          curl -sL "https://github.com/${REPO}/releases/download/${REF_NAME}/Cockpit-${VERSION}-arm64.dmg" -o arm64.dmg
          curl -sL "https://github.com/${REPO}/releases/download/${REF_NAME}/Cockpit-${VERSION}-x64.dmg" -o x64.dmg

          # Compute SHA256
          echo "sha256_arm64=$(shasum -a 256 arm64.dmg | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "sha256_x64=$(shasum -a 256 x64.dmg | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-cockpit
        uses: actions/checkout@v4
        with:
          repository: mcoquet/homebrew-cockpit
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-cockpit

      - name: Update cask formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256_ARM64: ${{ steps.checksums.outputs.sha256_arm64 }}
          SHA256_X64: ${{ steps.checksums.outputs.sha256_x64 }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > homebrew-cockpit/Casks/cockpit.rb << EOF
          cask "cockpit" do
            version "${VERSION}"

            on_arm do
              sha256 "${SHA256_ARM64}"
              url "https://github.com/${REPO}/releases/download/${REF_NAME}/Cockpit-#{version}-arm64.dmg"
            end

            on_intel do
              sha256 "${SHA256_X64}"
              url "https://github.com/${REPO}/releases/download/${REF_NAME}/Cockpit-#{version}-x64.dmg"
            end

            name "Cockpit"
            desc "macOS menubar app for managing Claude Code projects"
            homepage "https://github.com/${REPO}"

            app "Cockpit.app"

            # Remove quarantine attribute since app is unsigned
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-d", "com.apple.quarantine", "#{appdir}/Cockpit.app"],
                             sudo: false
            end

            zap trash: [
              "~/Library/Application Support/cockpit",
              "~/Library/Preferences/com.cockpit.app.plist",
            ]
          end
          EOF

      - name: Commit and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd homebrew-cockpit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/cockpit.rb
          git commit -m "Update cockpit to ${VERSION}"
          git push
